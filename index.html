<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nasab Pro - Ultra Stable Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1a5276; --secondary: #2980b9; --bg: #f4f7fb; }
        body { background: var(--bg); font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        #login-page { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--primary); position: fixed; width: 100%; z-index: 9999; }
        .login-card { width: 90%; max-width: 360px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .hidden { display: none !important; }
        .viewport { width: 100vw; height: calc(100vh - 60px); overflow: hidden; position: relative; background: #eef2f7; cursor: grab; }
        .tree-wrapper { position: absolute; transform-origin: 0 0; padding: 100px; display: inline-block; }
        .tree ul { padding-top: 20px; position: relative; display: flex; justify-content: center; padding-left: 0; }
        .tree li { list-style-type: none; position: relative; padding: 20px 5px 0 5px; text-align: center; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #3498db; width: 50%; height: 20px; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid #3498db; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid #3498db; border-radius: 0 5px 0 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #3498db; width: 0; height: 20px; }
        .person-card { border: 2px solid #3498db; padding: 10px; border-radius: 10px; background: white; min-width: 140px; display: inline-block; }
        .name { font-weight: bold; color: var(--primary); font-size: 14px; }
        #diag-log { font-size: 10px; background: #222; color: #0f0; padding: 10px; border-radius: 8px; margin-top: 15px; text-align: left; max-height: 100px; overflow-y: auto; font-family: monospace; }
        #custom-menu { position: absolute; display: none; z-index: 10000; background: white; border-radius: 8px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); overflow: hidden; min-width: 160px; }
        .menu-item { padding: 12px 15px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-size: 14px; }
        .menu-item:hover { background: #f8f9fa; }
    </style>
</head>
<body>

<div id="login-page">
    <div class="login-card">
        <h4 class="fw-bold text-primary">NASAB PRO</h4>
        <p class="text-muted small">Cloud Genealogy System</p>
        <div class="text-start mt-4">
            <input type="text" id="app-user" class="form-control mb-2 rounded-pill px-3" placeholder="Username (admin)">
            <input type="password" id="app-pass" class="form-control mb-3 rounded-pill px-3" placeholder="Password (admin123)">
            <button id="btn-login" class="btn btn-primary w-100 rounded-pill fw-bold mb-2" onclick="attemptLogin()">LOGIN</button>
            <button class="btn btn-outline-secondary btn-sm w-100 rounded-pill" onclick="toggleSetup(true)">KONFIGURASI CLOUD</button>
        </div>
        <div id="diag-log">Sistem Siap.</div>
    </div>
</div>

<div id="app-content" class="hidden">
    <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
        <span class="navbar-brand fw-bold">NasabCloud</span>
        <button class="btn btn-sm btn-light rounded-circle" onclick="location.reload()"><i class="fas fa-power-off"></i></button>
    </nav>
    <div class="viewport" id="viewport">
        <div class="tree-wrapper" id="tree-wrapper"><div id="tree-root" class="tree"></div></div>
    </div>
</div>

<!-- MODAL KONFIGURASI -->
<div id="setup-overlay" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10001; display:flex; align-items:center; justify-content:center;">
    <div class="bg-white p-4 rounded-4 shadow" style="width:90%; max-width:350px;">
        <h6 class="fw-bold mb-3">KONFIGURASI GITHUB CLOUD</h6>
        <div class="alert alert-warning p-2 small">Gunakan hanya nama User & Repo saja.</div>
        <input type="text" id="gh-owner" class="form-control mb-2" placeholder="GitHub Username (Contoh: budinasab)">
        <input type="text" id="gh-repo" class="form-control mb-2" placeholder="Nama Repo (Contoh: silsilah)">
        <input type="password" id="gh-token" class="form-control mb-3" placeholder="GitHub Token (ghp_...)">
        <button class="btn btn-primary w-100 mb-2 rounded-pill" onclick="saveCloudConfig()">SIMPAN</button>
        <button class="btn btn-light w-100 rounded-pill border" onclick="toggleSetup(false)">BATAL</button>
    </div>
</div>

<!-- CONTEXT MENU -->
<div id="custom-menu">
    <button class="menu-item" onclick="openNodeModal('child')"><i class="fas fa-plus me-2"></i>Tambah Anak</button>
    <button class="menu-item" onclick="openNodeModal('edit')"><i class="fas fa-edit me-2"></i>Edit Data</button>
    <button class="menu-item text-danger" onclick="deleteNode()"><i class="fas fa-trash me-2"></i>Hapus</button>
</div>

<!-- DATA MODAL -->
<div class="modal fade" id="dataModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content"><div class="modal-body text-center">
    <h6 id="modalTitle" class="fw-bold mb-3">Data Silsilah</h6>
    <input type="text" id="inp-name" class="form-control mb-2" placeholder="Nama Lengkap">
    <input type="text" id="inp-spouse" class="form-control mb-3" placeholder="Nama Pasangan">
    <button class="btn btn-primary w-100 rounded-pill fw-bold" onclick="saveData()">SIMPAN</button>
</div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let db = { family: [], users: [] }, sha = "", selectedId = null, mode = "";
    
    function log(m) {
        const el = document.getElementById('diag-log');
        el.innerHTML += `<br>> ${m}`;
        el.scrollTop = el.scrollHeight;
    }

    // Pembersihan URL Otomatis
    function cleanInput(val) {
        return val.replace(/https:\/\/github.com\//, '').replace(/\/$/, '').trim();
    }

    async function attemptLogin() {
        const btn = document.getElementById('btn-login');
        const owner = cleanInput(localStorage.getItem('nb_owner') || '');
        const repo = cleanInput(localStorage.getItem('nb_repo') || '');
        const token = (localStorage.getItem('nb_token') || '').trim();

        if(!owner || !repo || !token) return alert("Buka KONFIGURASI CLOUD dan isi data dengan benar!");

        btn.disabled = true;
        log("Mencoba koneksi...");

        const url = `https://api.github.com/repos/${owner}/${repo}/contents/data.json`;
        log(`URL: ${url}`);

        try {
            const res = await fetch(url, {
                method: 'GET',
                headers: { 
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/vnd.github.v3+json"
                }
            });

            if(res.ok) {
                const data = await res.json();
                sha = data.sha;
                const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                db = content;
                
                const u = document.getElementById('app-user').value;
                const p = document.getElementById('app-pass').value;
                const user = db.users.find(x => x.username === u && x.pass === p);

                if(user) {
                    log("Login Berhasil!");
                    document.getElementById('login-page').classList.add('hidden');
                    document.getElementById('app-content').classList.remove('hidden');
                    renderTree();
                } else {
                    log("User/Pass Salah.");
                    alert("Username atau Password Salah!");
                }
            } else {
                const errJson = await res.json();
                log(`Error ${res.status}: ${errJson.message}`);
                alert(`GitHub Menolak Koneksi (${res.status}): ${errJson.message}`);
            }
        } catch (e) {
            log(`CRITICAL ERROR: ${e.message}`);
            alert("GAGAL TOTAL: Browser tidak bisa menghubungi GitHub. Periksa koneksi internet atau matikan VPN/AdBlocker.");
        } finally { btn.disabled = false; }
    }

    async function pushCloud() {
        const owner = cleanInput(localStorage.getItem('nb_owner'));
        const repo = cleanInput(localStorage.getItem('nb_repo'));
        const token = localStorage.getItem('nb_token').trim();
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(db))));
        
        try {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/data.json`, {
                method: 'PUT',
                headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Update Silsilah", content, sha })
            });
            if(res.ok) {
                const data = await res.json();
                sha = data.content.sha;
                log("Data Cloud Diperbarui.");
            }
        } catch (e) { log("Gagal Upload: " + e.message); }
    }

    function renderTree() {
        const root = db.family.find(p => !p.parentId);
        if(!root) return;
        document.getElementById('tree-root').innerHTML = `<ul>${buildNode(root)}</ul>`;
    }

    function buildNode(p) {
        const kids = db.family.filter(c => c.parentId === p.id);
        return `<li>
            <div class="person-card" data-id="${p.id}">
                <div class="name">${p.name}</div>
                ${p.spouse ? `<div class="spouse" style="font-size:11px;color:red;">${p.spouse}</div>` : ''}
            </div>
            ${kids.length > 0 ? `<ul>${kids.map(k => buildNode(k)).join('')}</ul>` : ''}
        </li>`;
    }

    // Navigation & Interaction
    let s = 0.8, x = 0, y = 50;
    const vp = document.getElementById('viewport'), wr = document.getElementById('tree-wrapper');
    const update = () => wr.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    vp.onmousedown = (e) => { 
        let sx = e.clientX - x, sy = e.clientY - y;
        window.onmousemove = (me) => { x = me.clientX - sx; y = me.clientY - sy; update(); };
        window.onmouseup = () => window.onmousemove = null;
    };

    function openNodeModal(m) {
        mode = m; const p = db.family.find(x => x.id === selectedId);
        document.getElementById('inp-name').value = (m==='edit') ? p.name : "";
        document.getElementById('inp-spouse').value = (m==='edit') ? (p.spouse||"") : "";
        new bootstrap.Modal(document.getElementById('dataModal')).show();
    }

    function saveData() {
        const n = document.getElementById('inp-name').value;
        const sp = document.getElementById('inp-spouse').value;
        if(mode === 'edit') {
            const p = db.family.find(x => x.id === selectedId);
            p.name = n; p.spouse = sp;
        } else {
            db.family.push({ id: Date.now().toString(), name: n, spouse: sp, parentId: selectedId });
        }
        bootstrap.Modal.getInstance(document.getElementById('dataModal')).hide();
        renderTree(); pushCloud();
    }

    function deleteNode() {
        if(confirm("Hapus data?")) {
            db.family = db.family.filter(p => p.id !== selectedId);
            renderTree(); pushCloud();
        }
    }

    const cm = document.getElementById('custom-menu');
    window.oncontextmenu = (e) => {
        const card = e.target.closest('.person-card');
        if(card) {
            e.preventDefault(); selectedId = card.dataset.id;
            cm.style.display = 'block'; cm.style.left = e.pageX+'px'; cm.style.top = e.pageY+'px';
        } else cm.style.display = 'none';
    };
    window.onclick = () => cm.style.display = 'none';

    function toggleSetup(v) {
        document.getElementById('setup-overlay').classList.toggle('hidden', !v);
        if(v) {
            document.getElementById('gh-owner').value = localStorage.getItem('nb_owner') || "";
            document.getElementById('gh-repo').value = localStorage.getItem('nb_repo') || "";
            document.getElementById('gh-token').value = localStorage.getItem('nb_token') || "";
        }
    }

    function saveCloudConfig() {
        localStorage.setItem('nb_owner', document.getElementById('gh-owner').value.trim());
        localStorage.setItem('nb_repo', document.getElementById('gh-repo').value.trim());
        localStorage.setItem('nb_token', document.getElementById('gh-token').value.trim());
        toggleSetup(false);
        location.reload();
    }
</script>
</body>
</html>
