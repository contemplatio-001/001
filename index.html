<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>Nasab Pro - Blue AutoCloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1a5276; --secondary: #2980b9; --accent: #d4e6f1; --wa: #25d366; --bg: #f4f7fb; }
        body { background-color: var(--bg); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; overflow: hidden; height: 100vh; width: 100vw; color: #333; }
        #login-page { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary), var(--secondary)); position: fixed; width: 100%; z-index: 5000; }
        .navbar { background-color: var(--primary) !important; z-index: 1050; border-bottom: 3px solid var(--secondary); }
        .viewport { width: 100vw; height: calc(100vh - 56px); overflow: hidden; position: relative; cursor: grab; background: #eef2f7; }
        .tree-wrapper { position: absolute; transform-origin: 0 0; padding: 150px; display: inline-block; transition: transform 0.1s ease-out; }
        .tree ul { padding-top: 25px; position: relative; display: flex; justify-content: center; padding-left: 0; }
        .tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 25px 5px 0 5px; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #3498db; width: 50%; height: 25px; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid #3498db; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid #3498db; border-radius: 0 5px 0 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #3498db; width: 0; height: 25px; }
        .person-card { border: 2px solid #d4e6f1; padding: 12px; display: inline-block; border-radius: 15px; background-color: white; min-width: 150px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); cursor: pointer; position: relative; z-index: 10; transition: 0.3s; }
        .person-card:hover { border-color: var(--secondary); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .person-card .name { font-weight: bold; color: var(--primary); font-size: 0.9rem; }
        .person-card .spouse { font-size: 0.75rem; color: #e74c3c; margin-top: 4px; border-top: 1px dashed #d4e6f1; padding-top: 4px; font-style: italic; }
        .gen-tag { background: var(--secondary); color: white; padding: 1px 8px; border-radius: 10px; font-size: 0.6rem; margin-bottom: 5px; display: inline-block; font-weight: bold; }
        .zoom-controls { position: fixed; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 12px; z-index: 2000; }
        .btn-zoom { width: 50px; height: 50px; border-radius: 50%; background: white; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-size: 1.3rem; color: var(--primary); display: flex; align-items: center; justify-content: center; }
        #custom-menu { position: absolute; display: none; z-index: 4000; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); min-width: 190px; overflow: hidden; border: 1px solid var(--accent); }
        .menu-item { padding: 12px 18px; cursor: pointer; display: flex; align-items: center; font-size: 0.9rem; border: none; width: 100%; background: none; text-align: left; }
        .menu-item:hover { background: #f0f7ff; color: var(--secondary); }
        .menu-item i { width: 28px; color: var(--secondary); }
        .hidden { display: none !important; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .sync-status { font-size: 0.7rem; margin-left: 8px; font-weight: normal; opacity: 0.8; }
        .offcanvas { background-color: var(--primary); color: white; width: 280px !important; }
        .nav-link-custom { color: white; padding: 12px 20px; display: flex; align-items: center; text-decoration: none; border-radius: 8px; margin-bottom: 5px; }
        .nav-link-custom:hover { background: rgba(255,255,255,0.2); color: #fff; }
    </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="login-page">
    <div class="card p-4 shadow-lg border-0" style="width: 90%; max-width: 340px; border-radius: 25px;">
        <div class="text-center mb-4">
            <div class="bg-primary text-white d-inline-block p-3 rounded-circle mb-3"><i class="fas fa-cloud fa-2x"></i></div>
            <h4 class="fw-bold" style="color: var(--primary);">Nasab Pro Cloud</h4>
            <p class="text-muted small">Hubungkan ke GitHub untuk memulai</p>
        </div>
        <div id="login-form">
            <div class="mb-3"><label class="small fw-bold">Username</label><input type="text" id="username" class="form-control rounded-pill px-3" placeholder="admin"></div>
            <div class="mb-3"><label class="small fw-bold">Password</label><input type="password" id="password" class="form-control rounded-pill px-3" placeholder="admin123"></div>
            <button class="btn btn-primary w-100 py-2 fw-bold rounded-pill mb-2" onclick="login()">LOGIN</button>
            <button class="btn btn-outline-secondary btn-sm w-100 rounded-pill" onclick="showCloudSetup()"><i class="fas fa-cog"></i> Pengaturan Cloud</button>
        </div>
    </div>
</div>

<!-- MAIN APP -->
<div id="main-app" class="hidden">
    <nav class="navbar navbar-dark shadow-sm px-2">
        <div class="container-fluid">
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"><span class="navbar-toggler-icon"></span></button>
            <span class="navbar-brand ms-2 fw-bold" onclick="goHome()" style="cursor:pointer">NasabCloud <span id="cloud-info" class="sync-status"></span></span>
            <span id="role-badge" class="badge bg-light text-primary rounded-pill"></span>
        </div>
    </nav>

    <div class="viewport" id="viewport">
        <div class="tree-wrapper" id="tree-wrapper"><div id="tree-root" class="tree"></div></div>
    </div>

    <div class="zoom-controls">
        <button class="btn-zoom" onclick="changeZoom(0.2)"><i class="fas fa-plus"></i></button>
        <button class="btn-zoom" onclick="changeZoom(-0.2)"><i class="fas fa-minus"></i></button>
        <button class="btn-zoom" onclick="resetZoom()"><i class="fas fa-expand"></i></button>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar">
        <div class="offcanvas-header text-white"><h5>NAVIGASI</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div>
        <div class="offcanvas-body">
            <a href="#" class="nav-link-custom" onclick="goHome()" data-bs-dismiss="offcanvas"><i class="fas fa-home"></i> Beranda</a>
            <div class="px-3 my-3">
                <label class="small text-white-50">Filter Generasi:</label>
                <select id="gen-filter" class="form-select form-select-sm bg-dark text-white" onchange="resetFocusAndRender()"></select>
            </div>
            <a href="#" class="nav-link-custom" onclick="syncWithCloud()"><i class="fas fa-sync"></i> Paksa Sinkron Cloud</a>
            <a href="#" class="nav-link-custom" onclick="showCloudSetup()" data-bs-dismiss="offcanvas"><i class="fas fa-key"></i> Update Token/Repo</a>
            <hr>
            <a href="#" class="nav-link-custom text-warning" onclick="logout()"><i class="fas fa-power-off"></i> Keluar</a>
        </div>
    </div>
</div>

<!-- MODAL SETUP CLOUD -->
<div class="modal fade" id="cloudSetupModal" data-bs-backdrop="static" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header border-0"><h6 class="fw-bold">Pengaturan GitHub Cloud</h6></div><div class="modal-body">
    <div class="mb-2"><label class="small">GitHub Username:</label><input type="text" id="gh-owner" class="form-control form-control-sm" placeholder="Contoh: budi-setiawan"></div>
    <div class="mb-2"><label class="small">Nama Repository:</label><input type="text" id="gh-repo" class="form-control form-control-sm" placeholder="Contoh: nasab-keluarga"></div>
    <div class="mb-3"><label class="small">Personal Access Token (ghp_...):</label><input type="password" id="gh-token" class="form-control form-control-sm" placeholder="Masukkan token ghp_xxx"></div>
    <div class="alert alert-info py-1 small">Pastikan file <b>data.json</b> sudah ada di repo Anda.</div>
    <button class="btn btn-primary btn-sm w-100 fw-bold rounded-pill" onclick="saveCloudSettings()">SIMPAN PENGATURAN</button>
</div></div></div></div>

<!-- MODAL DETAIL & INPUT (Ringkas) -->
<div class="modal fade" id="detailModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-body text-center p-4">
    <button type="button" class="btn-close float-end" data-bs-dismiss="modal"></button>
    <img id="detImg" src="" class="profile-img">
    <h4 id="detName" class="fw-bold"></h4>
    <p id="detSpouse" class="text-danger small"></p>
    <div class="row g-2 mb-3"><div class="col-6 bg-light p-2 rounded"><small>Gen</small><br><b id="detGen"></b></div><div class="col-6 bg-light p-2 rounded"><small>Anak</small><br><b id="detChildren"></b></div></div>
    <div class="text-start small p-2 bg-light rounded mb-3" id="detBio"></div>
    <div id="contact-area"></div>
</div></div></div></div>

<div class="modal fade" id="nodeModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content"><div class="modal-header border-0"><h6>Input Data</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
    <input type="file" id="inputPhoto" class="form-control form-control-sm mb-2" onchange="previewFile()">
    <input type="text" id="inputName" class="form-control form-control-sm mb-2" placeholder="Nama Lengkap">
    <div id="extended-fields"><input type="number" id="inputPhone" class="form-control form-control-sm mb-2" placeholder="WA (628...)"><textarea id="inputBio" class="form-control form-control-sm mb-2" placeholder="Biografi..."></textarea></div>
    <button class="btn btn-primary w-100 btn-sm rounded-pill" onclick="saveData()">SIMPAN DATA</button>
</div></div></div></div>

<div id="custom-menu">
    <button class="menu-item" onclick="handleMenuAction('child')"><i class="fas fa-child"></i> Tambah Anak</button>
    <button class="menu-item" onclick="handleMenuAction('spouse')"><i class="fas fa-ring"></i> Edit Pasangan</button>
    <button class="menu-item" onclick="handleMenuAction('edit')"><i class="fas fa-edit"></i> Edit Profil</button>
    <button class="menu-item text-danger" onclick="handleMenuAction('delete')"><i class="fas fa-trash"></i> Hapus</button>
    <button class="menu-item" onclick="showDetailFromMenu()"><i class="fas fa-id-card"></i> Detail</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let familyData = [], systemUsers = [], currentSha = "";
    let currentUser = null, selectedNodeId = null, currentBase64 = "", currentAction = null, focusNodeId = null;
    const GH_PATH = "data.json";

    // Zoom & Drag Logic
    let scale = 0.8, posX = 0, posY = 0;
    const viewport = document.getElementById('viewport'), wrapper = document.getElementById('tree-wrapper');
    let isDragging = false, startX, startY;
    viewport.addEventListener('mousedown', e => { if(e.button === 0) { isDragging = true; startX = e.clientX - posX; startY = e.clientY - posY; }});
    window.addEventListener('mousemove', e => { if (isDragging) { posX = e.clientX - startX; posY = e.clientY - startY; updateTransform(); } });
    window.addEventListener('mouseup', () => isDragging = false);
    function updateTransform() { wrapper.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }
    function changeZoom(d) { scale = Math.min(Math.max(0.3, scale + d), 3); updateTransform(); }
    function resetZoom() { scale = 0.8; posX = (viewport.offsetWidth - wrapper.offsetWidth * scale) / 2; posY = 50; updateTransform(); }

    // Cloud Logic
    function showCloudSetup() {
        document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || "";
        document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || "";
        document.getElementById('gh-token').value = localStorage.getItem('gh_token') || "";
        new bootstrap.Modal(document.getElementById('cloudSetupModal')).show();
    }

    function saveCloudSettings() {
        localStorage.setItem('gh_owner', document.getElementById('gh-owner').value.trim());
        localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
        localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
        bootstrap.Modal.getInstance(document.getElementById('cloudSetupModal')).hide();
        alert("Pengaturan disimpan. Silahkan Login.");
    }

    async function syncWithCloud() {
        const owner = localStorage.getItem('gh_owner'), repo = localStorage.getItem('gh_repo'), token = localStorage.getItem('gh_token');
        if(!owner || !repo || !token) { showCloudSetup(); return false; }
        
        const info = document.getElementById('cloud-info');
        info.innerText = "(Syncing...)";
        try {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${GH_PATH}`, {
                headers: { "Authorization": `token ${token}`, "Accept": "application/vnd.github.v3+json", "Cache-Control": "no-cache" }
            });
            if (res.ok) {
                const d = await res.json();
                currentSha = d.sha;
                const decoded = JSON.parse(decodeURIComponent(escape(atob(d.content))));
                familyData = decoded.family;
                systemUsers = decoded.users;
                renderTree();
                info.innerText = "(Connected)";
                return true;
            } else {
                alert(`Gagal Connect GitHub (Error ${res.status}). Periksa Token/Repo.`);
                return false;
            }
        } catch (e) { console.error(e); return false; }
    }

    async function pushToCloud() {
        const owner = localStorage.getItem('gh_owner'), repo = localStorage.getItem('gh_repo'), token = localStorage.getItem('gh_token');
        const content = btoa(unescape(encodeURIComponent(JSON.stringify({ family: familyData, users: systemUsers }))));
        try {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${GH_PATH}`, {
                method: 'PUT',
                headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Update Data", content: content, sha: currentSha })
            });
            if (res.ok) { const d = await res.json(); currentSha = d.content.sha; }
        } catch (e) { alert("Gagal Simpan Cloud!"); }
    }

    // App Logic
    async function login() {
        const ok = await syncWithCloud();
        if(!ok) return;
        const u = document.getElementById('username').value, p = document.getElementById('password').value;
        const user = systemUsers.find(x => x.username === u && x.pass === p);
        if (user) {
            currentUser = user;
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('role-badge').innerText = user.role.toUpperCase();
            goHome();
        } else alert("Login Salah!");
    }

    function renderTree() {
        const container = document.getElementById('tree-root'), filterVal = document.getElementById('gen-filter').value || 'all';
        updateGenFilterMenu();
        const rootNode = focusNodeId ? familyData.find(p => p.id === focusNodeId) : familyData.find(p => !p.parentId);
        if (!rootNode) return;
        if (filterVal === 'all') {
            container.innerHTML = `<ul>${buildTreeHtml(rootNode)}</ul>`;
            container.className = "tree";
        } else {
            const members = familyData.filter(p => getGeneration(p.id) === parseInt(filterVal));
            container.innerHTML = `<div class="gen-grid">${members.map(p => `<div class="person-card" onclick="showDetail('${p.id}')" data-id="${p.id}"><div class="name">${p.name}</div></div>`).join('')}</div>`;
        }
    }

    function buildTreeHtml(person) {
        const children = familyData.filter(c => c.parentId === person.id);
        return `<li><div class="person-card shadow-sm" onclick="showDetail('${person.id}')" data-id="${person.id}"><span class="gen-tag">Gen ${getGeneration(person.id)}</span><div class="name">${person.name}</div>${person.spouse ? `<div class="spouse"><i class="fas fa-heart"></i> ${person.spouse}</div>` : ''}</div>${children.length > 0 ? `<ul>${children.map(c => buildTreeHtml(c)).join('')}</ul>` : ''}</li>`;
    }

    function getGeneration(id) { let l = 1, c = familyData.find(p => p.id === id); while(c && c.parentId) { l++; c = familyData.find(p => p.id === c.parentId); } return l; }
    function goHome() { focusNodeId = null; document.getElementById('gen-filter').value = 'all'; renderTree(); setTimeout(resetZoom, 200); }
    
    function showDetail(id) {
        selectedNodeId = id; const p = familyData.find(x => x.id === id);
        document.getElementById('detName').innerText = p.name;
        document.getElementById('detSpouse').innerText = p.spouse ? "Pasangan: " + p.spouse : "";
        document.getElementById('detGen').innerText = getGeneration(id);
        document.getElementById('detChildren').innerText = familyData.filter(x => x.parentId === id).length;
        document.getElementById('detBio').innerText = p.bio || "";
        document.getElementById('detImg').src = p.photo || "https://via.placeholder.com/100";
        const waArea = document.getElementById('contact-area');
        if(p.phone) waArea.innerHTML = `<a href="https://wa.me/${p.phone}" target="_blank" class="btn btn-success btn-sm w-100 rounded-pill">WHATSAPP</a>`;
        else waArea.innerHTML = "";
        new bootstrap.Modal(document.getElementById('detailModal')).show();
    }

    function saveData() {
        const n = document.getElementById('inputName').value.trim();
        if(!n) return;
        if (currentAction === 'edit') {
            const p = familyData.find(x => x.id === selectedNodeId);
            p.name = n; p.phone = document.getElementById('inputPhone').value;
            p.bio = document.getElementById('inputBio').value; p.photo = currentBase64;
        } else if (currentAction === 'child') {
            familyData.push({ id: Date.now().toString(), name: n, parentId: selectedNodeId, spouse: "", 
                bio: document.getElementById('inputBio').value, phone: document.getElementById('inputPhone').value, photo: currentBase64 });
        } else if (currentAction === 'spouse') {
            familyData.find(x => x.id === selectedNodeId).spouse = n;
        }
        bootstrap.Modal.getInstance(document.getElementById('nodeModal')).hide();
        renderTree(); pushToCloud();
    }

    function handleMenuAction(type) {
        currentAction = type;
        if (type === 'delete') {
            if (confirm("Hapus orang ini?")) { familyData = familyData.filter(p => p.id !== selectedNodeId); renderTree(); pushToCloud(); }
            return;
        }
        document.getElementById('extended-fields').classList.toggle('hidden', type === 'spouse');
        const modal = new bootstrap.Modal(document.getElementById('nodeModal'));
        if (type === 'edit') {
            const p = familyData.find(x => x.id === selectedNodeId);
            document.getElementById('inputName').value = p.name;
            document.getElementById('inputPhone').value = p.phone || "";
            document.getElementById('inputBio').value = p.bio || "";
            currentBase64 = p.photo || "";
        } else {
            document.getElementById('inputName').value = ""; document.getElementById('inputPhone').value = ""; document.getElementById('inputBio').value = ""; currentBase64 = "";
        }
        modal.show();
    }

    function updateGenFilterMenu() {
        const s = document.getElementById('gen-filter'); let max = 1;
        familyData.forEach(p => { const g = getGeneration(p.id); if(g > max) max = g; });
        let h = '<option value="all">Semua</option>';
        for(let i=1; i<=max; i++) h += `<option value="${i}">Gen ${i}</option>`;
        s.innerHTML = h;
    }
    function previewFile() {
        const file = document.getElementById('inputPhoto').files[0], reader = new FileReader();
        reader.onloadend = () => { currentBase64 = reader.result; };
        if(file) reader.readAsDataURL(file);
    }
    function logout() { location.reload(); }
    function showDetailFromMenu() { showDetail(selectedNodeId); }
    function resetFocusAndRender() { focusNodeId = null; renderTree(); }

    const menu = document.getElementById('custom-menu');
    window.addEventListener('contextmenu', e => {
        const card = e.target.closest('.person-card');
        if (card && currentUser && currentUser.role !== 'viewer') { 
            e.preventDefault(); selectedNodeId = card.getAttribute('data-id'); 
            menu.style.display = 'block'; menu.style.left = e.pageX + 'px'; menu.style.top = e.pageY + 'px'; 
        } else menu.style.display = 'none';
    });
    window.addEventListener('click', () => menu.style.display = 'none');
</script>
</body>
</html>
